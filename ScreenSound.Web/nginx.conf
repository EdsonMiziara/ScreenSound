server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Faz o Blazor carregar appsettings.Docker.json (APIServer:Url = "api/")
    add_header Blazor-Environment Docker always;

    # Usa os arquivos .gz gerados no publish
    gzip_static on;

    # API no mesmo endereço do front: http://localhost:8080/api/... -> http://api:8080/...
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    # Arquivos do framework têm hash no nome: podem ficar em cache
    location /_framework/ {
        add_header Blazor-Environment Docker always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Rotas do SPA (ex.: /Musicas, /Playlist/1) caem no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
